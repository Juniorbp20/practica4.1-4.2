<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica de Matemática Discreta · 4.1 y 4.2</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#1c2230;--muted:#5b6475;--line:#dfe3ea;
  --brand:#2457c5;--brand-ink:#fff;--ok:#1b7f4b;--ok-bg:#e4f4ea;--bad:#b3261e;--bad-bg:#fbe8e6;--warn:#8a5a00;--warn-bg:#fff3d6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c;--card:#1b202b;--ink:#e8ecf3;--muted:#9aa4b6;--line:#2c3342;--brand:#6c9bff;--brand-ink:#0d1220;--ok:#5fd193;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1c1a;--warn:#f2c46d;--warn-bg:#3a2e12}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.45rem;margin:.2em 0 .1em}
h2{font-size:1.15rem;margin:1.2em 0 .5em}
p.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{width:100%}
.row{display:flex;gap:12px;align-items:center}
.row input[type=number]{width:90px}
.hint{color:var(--muted);font-size:.9rem;margin-top:6px}
.btn{display:inline-block;border:0;background:var(--brand);color:var(--brand-ink);padding:11px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.78rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;border-radius:10px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .ex{color:var(--ink);margin-top:6px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font-size:2.6rem;font-weight:800;line-height:1}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:.9rem}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.mid{background:var(--warn-bg);color:var(--warn)}.badge.low{background:var(--bad-bg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.mini{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.mini>i{display:block;height:100%;background:var(--ok)}
.mini.low>i{background:var(--bad)}.mini.mid>i{background:#d99a00}
.wr{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.wr .l{color:var(--muted);font-size:.88rem}
.hidden{display:none!important}
@media print{
  body{background:#fff;color:#000}
  .noprint{display:none!important}
  .card{break-inside:avoid;border-color:#bbb}
  :root{--card:#fff;--ink:#000;--muted:#444;--line:#ccc}
}
</style>
</head>
<body>
<main>

<!-- PANTALLA 1: configuración -->
<section id="setup">
  <h1>Práctica de Matemática Discreta</h1>
  <p class="sub">Prácticas 4.1 (producto cartesiano y relaciones) y 4.2 (equivalencia, particiones y orden). Elija la dificultad y la cantidad de preguntas.</p>

  <div class="card">
    <label class="f" for="nombre">Nombre (aparece en el reporte)</label>
    <input type="text" id="nombre" value="Bonifacio" maxlength="40">

    <label class="f">Práctica</label>
    <div class="chips" id="chipPractica" role="group" aria-label="Práctica"></div>

    <label class="f">Dificultad</label>
    <div class="chips" id="chipDif" role="group" aria-label="Dificultad"></div>

    <label class="f">Tipos de pregunta</label>
    <div class="chips" id="chipTipo" role="group" aria-label="Tipos de pregunta"></div>

    <label class="f" for="cant">Cantidad de preguntas</label>
    <div class="row">
      <input type="range" id="rango" min="1" max="10" value="10">
      <input type="number" id="cant" min="1" max="10" value="10">
    </div>
    <div class="hint" id="disp"></div>

    <label class="f" style="display:flex;gap:8px;align-items:center;font-weight:500">
      <input type="checkbox" id="inmediato" checked> Mostrar si acerté y la explicación después de cada pregunta
    </label>

    <div class="btns"><button class="btn" id="btnIniciar">Comenzar</button></div>
  </div>

  <div class="card hidden" id="histCard">
    <h2 style="margin-top:0">Intentos anteriores en este navegador</h2>
    <table id="histTable"></table>
  </div>
</section>

<!-- PANTALLA 2: preguntas -->
<section id="quiz" class="hidden">
  <div class="top"><span id="prog"></span><span id="aciertos"></span></div>
  <div class="bar"><i id="barra"></i></div>
  <div class="card">
    <div class="tags" id="tags"></div>
    <div class="q" id="enunciado"></div>
    <div id="respuesta"></div>
    <div id="fb"></div>
    <div class="btns">
      <button class="btn" id="btnComprobar" disabled>Comprobar</button>
      <button class="btn hidden" id="btnSig">Siguiente</button>
      <button class="btn sec" id="btnAbandonar">Terminar ahora</button>
    </div>
  </div>
</section>

<!-- PANTALLA 3: reporte -->
<section id="reporte" class="hidden">
  <div id="repContenido"></div>
  <div class="btns noprint">
    <button class="btn" id="btnImprimir">Imprimir o guardar como PDF</button>
    <button class="btn sec" id="btnDescargar">Descargar reporte (.html)</button>
    <button class="btn sec" id="btnCopiar">Copiar resumen</button>
  </div>
  <div class="btns noprint">
    <button class="btn sec" id="btnFalladas">Repasar solo las falladas</button>
    <button class="btn sec" id="btnNueva">Nueva práctica</button>
  </div>
  <div class="hint noprint" id="msgCopia"></div>
</section>

</main>

<script>
const BANK = [
/* ===== PRÁCTICA 4.1 · FÁCIL ===== */
{t:"mc",d:1,p:"4.1",q:"Si |A| = 2 y |B| = 5, ¿cuánto vale |A × B|?",o:["7","10","25","32"],a:1,e:"El cardinal del producto es |A|·|B| = 2·5 = 10."},
{t:"tf",d:1,p:"4.1",q:"(a, b) = (b, a) siempre, sin importar los valores de a y b.",a:false,e:"El orden importa: (a, b) = (b, a) solo cuando a = b. Por eso, en general, A × B ≠ B × A."},
{t:"fill",d:1,p:"4.1",q:"Si |A| = 2, |B| = 3 y |C| = 4, ¿cuánto vale |A × B × C|? (escriba un número)",a:["24"],e:"|A × B × C| = |A|·|B|·|C| = 2·3·4 = 24."},
{t:"tf",d:1,p:"4.1",q:"A × B y B × A siempre tienen el mismo número de elementos.",a:true,e:"Los dos tienen |A|·|B| elementos, aunque en general no son el mismo conjunto."},
{t:"mc",d:1,p:"4.1",q:"El dominio de R = {(1,2), (3,4), (1,5)} es:",o:["{2, 4, 5}","{1, 3}","{1, 2, 3, 4, 5}","{1, 3, 5}"],a:1,e:"El dominio reúne las primeras componentes sin repetir: {1, 3}."},
{t:"fill",d:1,p:"4.1",q:"La imagen de R = {(1,2), (3,4), (1,5)} es el conjunto de las segundas componentes. Escríbala separando con comas (ejemplo: 7,8,9).",a:["2,4,5"],set:true,e:"La imagen reúne las segundas componentes: {2, 4, 5}."},
{t:"tf",d:1,p:"4.1",q:"Una relación es reflexiva si (a, a) ∈ R para todo a ∈ A.",a:true,e:"Esa es la definición de reflexiva: cada elemento está relacionado consigo mismo."},
{t:"mc",d:1,p:"4.1",q:"¿Qué propiedad exige que (a, b) ∈ R implique (b, a) ∈ R?",o:["Reflexiva","Simétrica","Antisimétrica","Transitiva"],a:1,e:"Esa es la simetría: todo par debe traer su inverso."},
{t:"tf",d:1,p:"4.1",q:"Antisimétrica es lo mismo que \"no simétrica\".",a:false,e:"No es lo mismo. La identidad es simétrica y antisimétrica a la vez, y {(1,2)} es antisimétrica y no simétrica."},
{t:"fill",d:1,p:"4.1",q:"La propiedad que dice: (a,b) ∈ R y (b,c) ∈ R ⇒ (a,c) ∈ R se llama... (escriba una palabra)",a:["transitiva","transitividad"],e:"Es la propiedad transitiva: toda cadena (a,b), (b,c) debe cerrar con (a,c)."},
{t:"mc",d:1,p:"4.1",q:"¿Cuánto vale A × ∅?",o:["A","∅","{∅}","A × A"],a:1,e:"No hay ningún par (x, y) con y ∈ ∅, así que A × ∅ = ∅."},
{t:"fill",d:1,p:"4.1",q:"¿Cuántos elementos tiene A × ∅? (escriba un número)",a:["0"],e:"A × ∅ = ∅, que tiene 0 elementos."},

/* ===== PRÁCTICA 4.1 · MEDIO ===== */
{t:"mc",d:2,p:"4.1",q:"En la demostración de A × (B − C) = (A × B) − (A × C), se pasa de x ∈ A ∧ (y ∈ B ∧ y ∉ C) a (x ∈ A ∧ y ∈ B) ∧ (x ∈ A ∧ y ∉ C). ¿Qué leyes se usan?",o:["Distributiva de ∧ sobre ∨","De Morgan","Idempotencia, conmutativa y asociativa","Silogismo disyuntivo"],a:2,e:"No hay ninguna disyunción en esa línea, así que no puede ser la distributiva. Se repite x ∈ A por idempotencia y se reordena con conmutativa y asociativa."},
{t:"mc",d:2,p:"4.1",q:"(x, y) ∉ A × C equivale a:",o:["x ∉ A ∧ y ∉ C","x ∉ A ∨ y ∉ C","x ∈ A ∨ y ∈ C","x ∈ A ∧ y ∉ C"],a:1,e:"(x, y) ∈ A × C significa x ∈ A ∧ y ∈ C. Su negación, por De Morgan, es x ∉ A ∨ y ∉ C."},
{t:"tf",d:2,p:"4.1",q:"La igualdad A × (B ∪ C) = (A ∪ B) × C es cierta para cualquier A, B y C.",a:false,e:"Con A = {1}, B = {2}, C = {3}: el lado izquierdo es {(1,2), (1,3)} y el derecho es {(1,3), (2,3)}. Son distintos."},
{t:"mc",d:2,p:"4.1",q:"R es simétrica y transitiva, y contiene (1,2). ¿Qué otros pares debe contener obligatoriamente?",o:["Solo (2,1)","(2,1), (1,1) y (2,2)","(1,1), (2,2) y (3,3)","Ninguno más"],a:1,e:"Por simetría contiene (2,1). Por transitividad, (1,2),(2,1) exigen (1,1) y (2,1),(1,2) exigen (2,2). No necesita ser reflexiva en los demás elementos."},
{t:"tf",d:2,p:"4.1",q:"La relación vacía sobre A = {1, 2, 3} es transitiva.",a:true,e:"No existe ninguna cadena (a,b), (b,c) que pueda romper la propiedad, así que se cumple vacíamente."},
{t:"fill",d:2,p:"4.1",q:"R = {(1,2), (2,3)} sobre {1, 2, 3}. ¿Qué par hay que agregar para que sea transitiva? (escríbalo como (a,b))",a:["(1,3)","1,3"],e:"La cadena (1,2), (2,3) exige (1,3). Con ese par no quedan cadenas sin cerrar."},
{t:"mc",d:2,p:"4.1",q:"La relación identidad R = {(x, x)} sobre un conjunto es:",o:["Solo simétrica","Solo antisimétrica","Simétrica y antisimétrica a la vez","Ni simétrica ni antisimétrica"],a:2,e:"Cada par es su propio inverso (simétrica) y no hay pares con x ≠ y (antisimétrica)."},
{t:"mc",d:2,p:"4.1",q:"Sea R = {(1,2), (2,1)} sobre {1, 2}. ¿Es antisimétrica?",o:["Sí, porque no es simétrica","Sí, porque no tiene pares repetidos","No, porque (1,2) y (2,1) están con 1 ≠ 2","No, porque no es reflexiva"],a:2,e:"Antisimétrica exige que (a,b) y (b,a) en R impliquen a = b. Aquí fallan con 1 ≠ 2."},
{t:"fill",d:2,p:"4.1",q:"A = {2,3,4,5,6}, B = {6,9,12,15,16} y R = {(a,b) | a y b son primos relativos}. ¿Cuál es el dominio de R? (separe con comas)",a:["2,3,4,5"],set:true,e:"El 6 no es primo relativo con ningún elemento de B, así que no aparece. El dominio es {2, 3, 4, 5}."},
{t:"mc",d:2,p:"4.1",q:"Con A = {2,3,4,5,6} y B = {6,9,12,15,16}, R = {(a,b) | a² = b}. ¿Cuál es la imagen?",o:["{3, 4}","{9, 16}","{4, 9, 16}","{6, 9, 12, 15, 16}"],a:1,e:"Solo 3² = 9 y 4² = 16 están en B. R = {(3,9), (4,16)}, con dominio {3, 4} e imagen {9, 16}."},
{t:"fill",d:2,p:"4.1",q:"M = {1,2,3,4} y R = {(2,1), (4,3), (1,4)}. ¿Cuántos pares hay que agregar como mínimo para que sea transitiva? (escriba un número)",a:["3"],e:"Se agregan (2,4), (1,3) y (2,3). Después no falta ninguno."},
{t:"tf",d:2,p:"4.1",q:"Para refutar una propiedad de una relación basta un contraejemplo.",a:true,e:"Un solo caso que viole la regla demuestra que la propiedad no se cumple. Para afirmarla hay que revisar todos los casos."},
{t:"tf",d:2,p:"4.1",q:"Si en una relación no existe ninguna cadena (a,b), (b,c), la transitividad se cumple vacíamente.",a:true,e:"No hay nada que cerrar, así que ninguna cadena puede romper la propiedad."},
{t:"mc",d:2,p:"4.1",q:"R₁ = {(a,b) ∈ Z × Z : a ≤ b}. ¿Qué propiedades tiene?",o:["Reflexiva, simétrica y transitiva","Reflexiva, antisimétrica y transitiva, no simétrica","Antisimétrica y transitiva, no reflexiva","Solo reflexiva y transitiva"],a:1,e:"a ≤ a siempre; a ≤ b y b ≤ a implican a = b; a ≤ b y b ≤ c implican a ≤ c. No es simétrica: 1 ≤ 2 pero 2 ≤ 1 es falso."},
{t:"mc",d:2,p:"4.1",q:"Sobre A = {1, 2, 3}, ¿qué propiedades cumple la relación vacía?",o:["Reflexiva, simétrica y transitiva","Solo simétrica","Simétrica, antisimétrica y transitiva, pero no reflexiva","Ninguna"],a:2,e:"Simétrica, antisimétrica y transitiva se cumplen vacíamente. No es reflexiva porque faltan (1,1), (2,2) y (3,3)."},

/* ===== PRÁCTICA 4.1 · DIFÍCIL ===== */
{t:"mc",d:3,p:"4.1",q:"En la demostración de A × (B − C) ⊆ (A × B) − (A × C), se pasa de (x ∈ A ∧ y ∈ B) ∧ y ∉ C a (x ∈ A ∧ y ∈ B) ∧ (x ∉ A ∨ y ∉ C). ¿Qué ley se usa?",o:["Simplificación","Adición (p ⇒ p ∨ q)","Silogismo disyuntivo","Idempotencia"],a:1,e:"Se parte de y ∉ C y se agrega la alternativa x ∉ A: p ⇒ p ∨ q. Es adición."},
{t:"mc",d:3,p:"4.1",q:"Con A={1}, B={2}, C={3}, D={4}: ¿qué par está en (A ∪ C) × (B ∪ D) pero no en (A × B) ∪ (C × D)?",o:["(1, 2)","(3, 4)","(1, 3)","(1, 4)"],a:3,e:"(A ∪ C) × (B ∪ D) = {1,3} × {2,4}, mientras que (A × B) ∪ (C × D) = {(1,2), (3,4)}. El par (1,4) solo está en el primero, así que la inclusión contraria no vale."},
{t:"tf",d:3,p:"4.1",q:"La relación \"a divide a b\" sobre Z es antisimétrica.",a:false,e:"2 divide a −2 y −2 divide a 2, con 2 ≠ −2. Solo es antisimétrica sobre los enteros positivos."},
{t:"mc",d:3,p:"4.1",q:"R₆ = {(a,b) ∈ Z × Z : a = 2b}. ¿Cuál descripción es correcta?",o:["Reflexiva y antisimétrica, no transitiva","Antisimétrica, no reflexiva, no simétrica y no transitiva","Simétrica y transitiva, no reflexiva","No reflexiva ni antisimétrica"],a:1,e:"No reflexiva: (1,1) no está. No simétrica: (2,1) sin (1,2). Antisimétrica: a = 2b y b = 2a dan a = 4a, luego a = 0 = b. No transitiva: (4,2) y (2,1) están pero (4,1) no."},
{t:"mc",d:3,p:"4.1",q:"R₇ = {(a,b) ∈ Z × Z : a − b es impar}. ¿Por qué NO es transitiva?",o:["Porque a − a = 0 no es impar","Porque (1,2) está pero (2,1) no","Porque (1,2) y (2,3) están, pero 1 − 3 = −2 es par","Sí es transitiva"],a:2,e:"1 − 2 = −1 y 2 − 3 = −1 son impares, pero 1 − 3 = −2 es par. La opción A explica por qué no es reflexiva."},
{t:"fill",d:3,p:"4.1",q:"A = {2,3,4,5,6}, B = {6,9,12,15,16} y R = {(a,b) | a y b son primos relativos}. ¿Cuántos pares tiene R? (escriba un número)",a:["9"],e:"R = {(2,9),(2,15),(3,16),(4,9),(4,15),(5,6),(5,9),(5,12),(5,16)}: 9 pares."},
{t:"tf",d:3,p:"4.1",q:"Para probar una igualdad de conjuntos basta probar una sola inclusión.",a:false,e:"Una igualdad exige doble inclusión (⊆ y ⊇), o una cadena donde todos los pasos sean equivalencias."},
{t:"mc",d:3,p:"4.1",q:"En la demostración de (A × B) ∪ (C × D) ⊆ (A ∪ C) × (B ∪ D) se pasa de (P ∧ Q) ∨ R a (P ∨ R) ∧ (Q ∨ R). ¿Qué ley es?",o:["Distributiva de ∧ sobre ∨","Distributiva de ∨ sobre ∧","Asociativa de ∨","Simplificación"],a:1,e:"La disyunción (∨) se distribuye sobre la conjunción (∧): (P ∧ Q) ∨ R = (P ∨ R) ∧ (Q ∨ R)."},
{t:"mc",d:3,p:"4.1",q:"Sobre A = {0, 1, 2, 3, 4, 5, 6}, ¿cuál relación es simétrica y antisimétrica a la vez?",o:["{(1,2), (2,1)}","{(0,0), (3,3)}","{(1,2), (2,3)}","{(1,1), (1,2)}"],a:1,e:"Todos sus pares son de la forma (x, x): cada uno es su propio inverso (simétrica) y no hay pares con x ≠ y (antisimétrica)."},
{t:"tf",d:3,p:"4.1",q:"Si R es simétrica y transitiva y (a, b) ∈ R con a ≠ b, entonces (a, a) ∈ R.",a:true,e:"Por simetría (b, a) ∈ R, y por transitividad (a, b), (b, a) exigen (a, a). Igualmente (b, b) ∈ R."},
{t:"fill",d:3,p:"4.1",q:"Con A = {1}, B = {2}, C = {3}: ¿qué par está en A × (B ∪ C) pero no en (A ∪ B) × C? (escríbalo como (a,b))",a:["(1,2)","1,2"],e:"A × (B ∪ C) = {(1,2), (1,3)} y (A ∪ B) × C = {(1,3), (2,3)}. El par (1,2) solo está en el primero."},

/* ===== PRÁCTICA 4.2 · FÁCIL ===== */
{t:"tf",d:1,p:"4.2",q:"Una relación de equivalencia es reflexiva, simétrica y transitiva.",a:true,e:"Esa es la definición de relación de equivalencia."},
{t:"mc",d:1,p:"4.2",q:"Una relación de orden parcial es:",o:["Reflexiva, simétrica y transitiva","Reflexiva, antisimétrica y transitiva","Simétrica, antisimétrica y transitiva","Reflexiva, simétrica y antisimétrica"],a:1,e:"Orden parcial = reflexiva + antisimétrica + transitiva."},
{t:"fill",d:1,p:"4.2",q:"Una partición tiene dos bloques de 3 elementos cada uno, {a,b,c} y {d,e,f}. ¿Cuántos pares tiene la relación de equivalencia que define? (escriba un número)",a:["18"],e:"Cada bloque aporta 3² = 9 pares. En total 9 + 9 = 18."},
{t:"tf",d:1,p:"4.2",q:"Dos clases de equivalencia distintas siempre son disjuntas.",a:true,e:"Dos clases son iguales o disjuntas; nunca se solapan sin coincidir."},
{t:"mc",d:1,p:"4.2",q:"La clase de equivalencia de a es:",o:["{x : (x, a) ∉ R}","{x ∈ A : (a, x) ∈ R}","A − {a}","{a}"],a:1,e:"[a] = {x ∈ A : (a, x) ∈ R}, los elementos relacionados con a."},
{t:"fill",d:1,p:"4.2",q:"En N, (n, m) ∈ R si n − m es par. ¿Cuántas clases de equivalencia distintas tiene? (escriba un número)",a:["2"],e:"n − m es par cuando n y m tienen la misma paridad. Hay dos clases: pares e impares."},
{t:"tf",d:1,p:"4.2",q:"Una partición puede incluir el conjunto vacío como bloque.",a:false,e:"Los bloques de una partición deben ser no vacíos, disjuntos de dos en dos, y su unión debe ser todo el conjunto."},
{t:"fill",d:1,p:"4.2",q:"Un bloque de 4 elementos aporta cuántos pares a la relación de equivalencia? (escriba un número)",a:["16"],e:"Un bloque de k elementos aporta k² pares: 4² = 16."},
{t:"tf",d:1,p:"4.2",q:"Una relación de orden es total si todo par de elementos es comparable.",a:true,e:"Total significa que para todo a, b se tiene (a, b) ∈ R o (b, a) ∈ R."},
{t:"mc",d:1,p:"4.2",q:"¿Cuál propiedad se exige a una relación de orden pero NO a una de equivalencia?",o:["Reflexiva","Transitiva","Simétrica","Antisimétrica"],a:3,e:"El orden exige antisimetría; la equivalencia exige simetría. Ambas piden reflexiva y transitiva."},

/* ===== PRÁCTICA 4.2 · MEDIO ===== */
{t:"mc",d:2,p:"4.2",q:"¿Cuál es una partición de {1, 2, 3, 4, 5, 6}?",o:["{{1,2}, {2,3}, {4,5,6}}","{{1,2}, {3,4}}","{{1,6}, {2,5}, {3,4}}","{{1,2}, {3,4}, {5,6}, ∅}"],a:2,e:"A repite el 2, B no cubre el 5 ni el 6 y D incluye el bloque vacío."},
{t:"mc",d:2,p:"4.2",q:"Si R es de equivalencia y (2, 5) ∈ R, entonces:",o:["[2] y [5] son disjuntas","[2] = [5]","[2] y [5] solo comparten el 2","No se puede saber"],a:1,e:"[a] = [b] si y solo si (a, b) ∈ R."},
{t:"fill",d:2,p:"4.2",q:"La partición {{a,b}, {c,d,e}} define una relación de equivalencia. ¿Cuántos pares tiene? (escriba un número)",a:["13"],e:"El bloque {a,b} aporta 4 pares y {c,d,e} aporta 9. Total 13."},
{t:"mc",d:2,p:"4.2",q:"R = {(1,1), (2,2), (3,3), (2,3)} sobre {1,2,3}. ¿Qué par agregar para que sea de equivalencia?",o:["(3,2)","(1,2)","(1,3)","Ninguno"],a:0,e:"Es reflexiva, pero (2,3) está sin (3,2). Agregándolo queda simétrica, y las cadenas cierran con pares que ya están."},
{t:"mc",d:2,p:"4.2",q:"En \"a divide a b\" sobre {1, …, 15}, ¿cuál par NO es comparable?",o:["3 y 9","2 y 8","4 y 6","5 y 15"],a:2,e:"4 no divide a 6 y 6 no divide a 4. Por eso el orden no es total."},
{t:"mc",d:2,p:"4.2",q:"¿Cuál es la única relación sobre un conjunto que es de equivalencia y de orden a la vez?",o:["La relación vacía","La relación ≤","La identidad R = {(x, x)}","A × A"],a:2,e:"Simétrica y antisimétrica a la vez solo permiten pares (x, x); con reflexividad, deben estar todos."},
{t:"tf",d:2,p:"4.2",q:"La divisibilidad es una relación de orden parcial sobre los enteros positivos.",a:true,e:"Es reflexiva, antisimétrica (a | b y b | a dan a = b si son positivos) y transitiva."},
{t:"tf",d:2,p:"4.2",q:"La divisibilidad sobre {1, 2, …, 15} es un orden total.",a:false,e:"2 y 3 no son comparables: ni 2 divide a 3 ni 3 divide a 2."},
{t:"fill",d:2,p:"4.2",q:"En N, (n, m) ∈ R si n − m es múltiplo de 3. ¿Cuántas clases de equivalencia tiene? (escriba un número)",a:["3"],e:"Las clases corresponden a los residuos 0, 1 y 2 al dividir entre 3."},
{t:"mc",d:2,p:"4.2",q:"La relación R = {(a,b) ∈ A × A : a = b} es:",o:["Solo de equivalencia","Solo de orden","De equivalencia y de orden","Ninguna de las dos"],a:2,e:"Es la identidad: reflexiva, simétrica, antisimétrica y transitiva."},
{t:"tf",d:2,p:"4.2",q:"Una relación simétrica y antisimétrica a la vez solo puede contener pares de la forma (x, x).",a:true,e:"Si (x, y) ∈ R, la simetría da (y, x) ∈ R y la antisimetría da x = y."},
{t:"fill",d:2,p:"4.2",q:"A = {1,2,3} con la partición {{1},{2,3}}. ¿Cuántos pares tiene la relación de equivalencia asociada? (escriba un número)",a:["5"],e:"El bloque {1} aporta 1 par y {2,3} aporta 4. Total 5."},

/* ===== PRÁCTICA 4.2 · DIFÍCIL ===== */
{t:"mc",d:3,p:"4.2",q:"X = {a,b,d,e}, R = {(a,a),(b,b),(d,d),(e,e),(a,b)} es un orden con (d,b) ∉ R. Si se agrega (d,a), ¿qué ocurre?",o:["Sigue siendo un orden válido","La transitividad obliga a agregar (d,b), que está prohibido","Deja de ser reflexiva","Deja de ser antisimétrica"],a:1,e:"(d,a) y (a,b) exigen (d,b), pero el enunciado pide (d,b) ∉ R."},
{t:"mc",d:3,p:"4.2",q:"¿Por qué la divisibilidad sobre Z NO es una relación de orden?",o:["No es reflexiva","No es transitiva","No es antisimétrica: 2 | −2 y −2 | 2 con 2 ≠ −2","No es simétrica"],a:2,e:"Los negativos rompen la antisimetría. Sobre los enteros positivos sí es un orden."},
{t:"tf",d:3,p:"4.2",q:"R = {(a,a), (b,b), (d,d), (e,e), (a,b)} es un orden total sobre {a, b, d, e}.",a:false,e:"a y d no son comparables: ni (a,d) ni (d,a) están en R. Es un orden parcial, no total."},
{t:"fill",d:3,p:"4.2",q:"En R, (x, y) ∈ R₅ si x − y es entero. ¿Qué conjunto es la clase de 0? (escriba una palabra o símbolo)",a:["z","enteros","losenteros"],e:"[0] = {y : 0 − y es entero} = Z, el conjunto de los enteros."},
{t:"tf",d:3,p:"4.2",q:"La relación ≤ sobre Z es de equivalencia.",a:false,e:"Es reflexiva y transitiva, pero no simétrica: 1 ≤ 2 y 2 ≤ 1 es falso. Es una relación de orden."},
{t:"mc",d:3,p:"4.2",q:"Para demostrar que \"n − m es par\" es transitiva: n − m = 2k y m − p = 2j. ¿Qué se concluye?",o:["n − p = 2(k − j)","n − p = 2(k + j), que es par","n − p = 2kj","No se puede concluir"],a:1,e:"Sumando: n − p = (n − m) + (m − p) = 2k + 2j = 2(k + j), que es par."},
{t:"tf",d:3,p:"4.2",q:"Una relación de equivalencia sobre A con una sola clase de equivalencia es A × A.",a:true,e:"Si todos los elementos están en la misma clase, todos están relacionados con todos."},
{t:"mc",d:3,p:"4.2",q:"En la demostración de que \"a divide a b\" es antisimétrica en los enteros positivos, de b = a·k y a = b·j se obtiene a = a(kj). ¿Qué sigue?",o:["kj = 1, luego k = j = 1 y b = a","k = j = 0","a = 0","kj = a"],a:0,e:"Como a ≠ 0, se cancela y kj = 1. Con k, j enteros positivos, k = j = 1, así que b = a."},
{t:"fill",d:3,p:"4.2",q:"Partición de {a,b,c,d} con bloques {a}, {b,c} y {d}. ¿Cuántos pares tiene la relación de equivalencia? (escriba un número)",a:["6"],e:"1 + 4 + 1 = 6 pares."},
{t:"tf",d:3,p:"4.2",q:"Si R es de equivalencia, entonces su conjunto cociente A/R es una partición de A.",a:true,e:"Las clases distintas son no vacías (cada a está en [a]), disjuntas y su unión es A."}
];


(function(){
"use strict";
const $=s=>document.querySelector(s);
const NOMBRE_TIPO={mc:"Selección múltiple",tf:"Verdadero o falso",fill:"Completar"};
const NOMBRE_DIF={1:"Fácil",2:"Medio",3:"Difícil"};
let selPract=new Set(["4.1","4.2"]);
let selDif="mix";           // 1,2,3 o "mix"
let selTipo=new Set(["mc","tf","fill"]);
let sesion=null;

function mk(tag,props,kids){const e=document.createElement(tag);Object.assign(e,props||{});(kids||[]).forEach(k=>e.append(k));return e;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s,isSet){
  s=String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[{}\s]/g,"").replace(/\.$/,"");
  if(isSet&&s.indexOf("(")<0){s=s.split(",").filter(Boolean).sort().join(",");}
  return s;
}

/* ---------- Configuración ---------- */
function chips(cont,items,isActive,onClick){
  cont.innerHTML="";
  items.forEach(([val,label])=>{
    const b=mk("button",{type:"button",className:"chip",textContent:label});
    b.setAttribute("aria-pressed",isActive(val)?"true":"false");
    b.onclick=()=>{onClick(val);render();};
    cont.append(b);
  });
}
function pool(){
  return BANK.filter(q=>selPract.has(q.p)&&selTipo.has(q.t)&&(selDif==="mix"||q.d===selDif));
}
function render(){
  chips($("#chipPractica"),[["4.1","Práctica 4.1"],["4.2","Práctica 4.2"]],v=>selPract.has(v),v=>{selPract.has(v)?selPract.delete(v):selPract.add(v);});
  chips($("#chipDif"),[[1,"Fácil"],[2,"Medio"],[3,"Difícil"],["mix","Mixta"]],v=>selDif===v,v=>{selDif=v;});
  chips($("#chipTipo"),[["mc","Selección múltiple"],["tf","Verdadero o falso"],["fill","Completar"]],v=>selTipo.has(v),v=>{selTipo.has(v)?selTipo.delete(v):selTipo.add(v);});
  const n=pool().length;
  const r=$("#rango"),c=$("#cant");
  r.max=c.max=Math.max(n,1);
  let val=parseInt(c.value,10)||1;
  if(val>n)val=n; if(val<1)val=Math.min(1,n)||1;
  r.value=c.value=val;
  $("#disp").textContent=n?("Hay "+n+" preguntas disponibles con esta selección."):"No hay preguntas con esta selección. Active al menos una práctica, un tipo y una dificultad.";
  $("#btnIniciar").disabled=n===0;
}
$("#rango").oninput=e=>{$("#cant").value=e.target.value;};
$("#cant").oninput=e=>{let v=parseInt(e.target.value,10);const m=pool().length;if(!isNaN(v)){if(v>m)v=m;if(v<1)v=1;e.target.value=v;$("#rango").value=v;}};

function leerHistorial(){try{return JSON.parse(localStorage.getItem("md_hist")||"[]");}catch(e){return[];}}
function guardarHistorial(h){try{localStorage.setItem("md_hist",JSON.stringify(h.slice(0,10)));}catch(e){}}
function pintarHistorial(){
  const h=leerHistorial();
  $("#histCard").classList.toggle("hidden",h.length===0);
  const t=$("#histTable");t.innerHTML="<tr><th>Fecha</th><th>Selección</th><th>Resultado</th></tr>";
  h.forEach(x=>{const tr=mk("tr");tr.innerHTML="<td>"+esc(x.fecha)+"</td><td>"+esc(x.sel)+"</td><td>"+x.ok+"/"+x.n+" ("+x.pct+"%)</td>";t.append(tr);});
}

/* ---------- Sesión ---------- */
function iniciar(lista,etiqueta){
  sesion={
    items:lista.map(q=>{
      let opts=null,corr=null;
      if(q.t==="mc"){const idx=shuffle(q.o.map((_,i)=>i));opts=idx.map(i=>q.o[i]);corr=idx.indexOf(q.a);}
      return {q,opts,corr,resp:null,ok:null,seg:0};
    }),
    i:0,aciertos:0,t0:Date.now(),tq:Date.now(),
    inmediato:$("#inmediato").checked,
    nombre:($("#nombre").value.trim()||"Bonifacio"),
    etiqueta:etiqueta
  };
  $("#setup").classList.add("hidden");$("#reporte").classList.add("hidden");$("#quiz").classList.remove("hidden");
  mostrar();
}
function etiquetaSeleccion(){
  const p=[...selPract].sort().join(" y ");
  const d=selDif==="mix"?"Mixta":NOMBRE_DIF[selDif];
  return "Práctica "+p+" · "+d;
}
$("#btnIniciar").onclick=()=>{
  const n=parseInt($("#cant").value,10)||1;
  const lista=shuffle(pool()).slice(0,n);
  iniciar(lista,etiquetaSeleccion());
};

function mostrar(){
  const s=sesion,it=s.items[s.i],q=it.q;
  s.tq=Date.now();
  $("#prog").textContent="Pregunta "+(s.i+1)+" de "+s.items.length;
  $("#aciertos").textContent="Aciertos: "+s.aciertos;
  $("#barra").style.width=(s.i/s.items.length*100)+"%";
  $("#tags").innerHTML="";
  [NOMBRE_TIPO[q.t],"Práctica "+q.p,NOMBRE_DIF[q.d]].forEach(x=>$("#tags").append(mk("span",{className:"tag",textContent:x})));
  $("#enunciado").textContent=q.q;
  $("#fb").innerHTML="";
  $("#btnSig").classList.add("hidden");
  $("#btnComprobar").classList.remove("hidden");
  $("#btnComprobar").disabled=true;
  const cont=$("#respuesta");cont.innerHTML="";
  it.resp=null;
  if(q.t==="mc"||q.t==="tf"){
    const lab=q.t==="mc"?it.opts:["Verdadero","Falso"];
    lab.forEach((t,i)=>{
      const b=mk("button",{type:"button",className:"opt",textContent:t});
      b.dataset.i=i;
      b.onclick=()=>{[...cont.children].forEach(c=>c.classList.remove("sel"));b.classList.add("sel");it.resp=i;$("#btnComprobar").disabled=false;};
      cont.append(b);
    });
  }else{
    const inp=mk("input",{type:"text",id:"fillIn",autocomplete:"off",placeholder:"Escriba su respuesta"});
    inp.oninput=()=>{it.resp=inp.value;$("#btnComprobar").disabled=inp.value.trim()==="";};
    inp.onkeydown=e=>{if(e.key==="Enter"&&!$("#btnComprobar").disabled)$("#btnComprobar").click();};
    cont.append(inp);inp.focus();
  }
}
function evaluar(it){
  const q=it.q;
  if(q.t==="mc")return it.resp===it.corr;
  if(q.t==="tf")return (it.resp===0)===q.a;
  const r=norm(it.resp,q.set);
  return q.a.some(x=>norm(x,q.set)===r);
}
function textoCorrecto(it){
  const q=it.q;
  if(q.t==="mc")return it.opts[it.corr];
  if(q.t==="tf")return q.a?"Verdadero":"Falso";
  return q.a[0];
}
function textoResp(it){
  const q=it.q;
  if(it.resp===null||it.resp==="")return "(sin respuesta)";
  if(q.t==="mc")return it.opts[it.resp];
  if(q.t==="tf")return it.resp===0?"Verdadero":"Falso";
  return String(it.resp);
}
$("#btnComprobar").onclick=()=>{
  const s=sesion,it=s.items[s.i],q=it.q;
  it.seg=Math.round((Date.now()-s.tq)/1000);
  it.ok=evaluar(it);
  if(it.ok)s.aciertos++;
  $("#aciertos").textContent="Aciertos: "+s.aciertos;
  $("#btnComprobar").classList.add("hidden");
  const cont=$("#respuesta");
  if(q.t==="mc"||q.t==="tf"){
    const correcto=q.t==="mc"?it.corr:(q.a?0:1);
    [...cont.children].forEach((b,i)=>{b.disabled=true;
      if(s.inmediato){if(i===correcto)b.classList.add("right");else if(i===it.resp)b.classList.add("wrong");}
    });
  }else{$("#fillIn").disabled=true;}
  if(s.inmediato){
    const fb=mk("div",{className:"fb "+(it.ok?"ok":"no")});
    fb.innerHTML="<strong>"+(it.ok?"Correcto.":"Incorrecto.")+"</strong>"+(it.ok?"":" Respuesta correcta: "+esc(textoCorrecto(it))+".")+"<div class='ex'>"+esc(q.e)+"</div>";
    $("#fb").append(fb);
  }
  const ultima=s.i===s.items.length-1;
  $("#btnSig").textContent=ultima?"Ver mi reporte":"Siguiente";
  $("#btnSig").classList.remove("hidden");
  $("#btnSig").focus();
};
$("#btnSig").onclick=()=>{
  const s=sesion;
  if(s.i===s.items.length-1){terminar();}else{s.i++;mostrar();}
};
$("#btnAbandonar").onclick=()=>{
  const s=sesion;
  // marcar preguntas sin responder como no contestadas
  s.items=s.items.filter((it,idx)=>it.ok!==null||false);
  if(s.items.length===0){volverInicio();return;}
  terminar();
};

/* ---------- Reporte ---------- */
function pct(a,b){return b?Math.round(a/b*100):0;}
function nivel(p){return p>=80?"ok":p>=60?"mid":"low";}
function veredicto(p){return p>=90?"Excelente":p>=80?"Muy bien":p>=70?"Bien":p>=60?"Aprobado, con puntos por reforzar":"Necesita más repaso";}
function agrupar(items,fn){
  const m={};items.forEach(it=>{const k=fn(it);(m[k]=m[k]||{n:0,ok:0});m[k].n++;if(it.ok)m[k].ok++;});return m;
}
function tablaGrupo(titulo,m,orden,nombre){
  let h="<table><tr><th>"+titulo+"</th><th>Aciertos</th><th>%</th><th></th></tr>";
  orden.forEach(k=>{const g=m[k];if(!g)return;const p=pct(g.ok,g.n);
    h+="<tr><td>"+esc(nombre(k))+"</td><td>"+g.ok+" de "+g.n+"</td><td>"+p+"%</td><td><div class='mini "+(nivel(p)==="ok"?"":nivel(p))+"'><i style='width:"+p+"%'></i></div></td></tr>";});
  return h+"</table>";
}
function construirReporte(){
  const s=sesion,items=s.items;
  const n=items.length,ok=items.filter(i=>i.ok).length,p=pct(ok,n);
  const seg=Math.round((Date.now()-s.t0)/1000);
  const mm=Math.floor(seg/60),ss=seg%60;
  const fecha=new Date().toLocaleString("es-DO",{dateStyle:"long",timeStyle:"short"});
  let h="";
  h+="<h1>Reporte de práctica · Matemática Discreta</h1>";
  h+="<p class='sub'>"+esc(s.nombre)+" · "+esc(fecha)+" · "+esc(s.etiqueta)+"</p>";
  h+="<div class='card'><div class='score'><div class='big'>"+p+"%</div><div><span class='badge "+nivel(p)+"'>"+esc(veredicto(p))+"</span><div style='margin-top:6px'>"+ok+" correctas de "+n+" preguntas · Tiempo total: "+mm+" min "+ss+" s</div></div></div></div>";
  h+="<div class='card'><h2 style='margin-top:0'>Resultado por tipo de pregunta</h2>"+tablaGrupo("Tipo",agrupar(items,i=>i.q.t),["mc","tf","fill"],k=>NOMBRE_TIPO[k])+"</div>";
  h+="<div class='card'><h2 style='margin-top:0'>Resultado por práctica</h2>"+tablaGrupo("Práctica",agrupar(items,i=>i.q.p),["4.1","4.2"],k=>"Práctica "+k)+"</div>";
  h+="<div class='card'><h2 style='margin-top:0'>Resultado por dificultad</h2>"+tablaGrupo("Dificultad",agrupar(items,i=>i.q.d),[1,2,3],k=>NOMBRE_DIF[k])+"</div>";
  const mal=items.filter(i=>!i.ok);
  h+="<div class='card'><h2 style='margin-top:0'>Preguntas falladas ("+mal.length+")</h2>";
  if(!mal.length){h+="<p>No falló ninguna pregunta en esta práctica.</p>";}
  mal.forEach((it,k)=>{
    h+="<div class='wr'><div class='l'>"+esc(NOMBRE_TIPO[it.q.t])+" · Práctica "+esc(it.q.p)+" · "+esc(NOMBRE_DIF[it.q.d])+"</div><div><strong>"+(k+1)+". "+esc(it.q.q)+"</strong></div>"
      +"<div>Su respuesta: <span style='color:var(--bad)'>"+esc(textoResp(it))+"</span></div>"
      +"<div>Respuesta correcta: <span style='color:var(--ok)'>"+esc(textoCorrecto(it))+"</span></div>"
      +"<div class='l' style='margin-top:4px'>"+esc(it.q.e)+"</div></div>";
  });
  h+="</div>";
  // Recomendación
  const porP=agrupar(items,i=>i.q.p);
  const debiles=Object.keys(porP).filter(k=>pct(porP[k].ok,porP[k].n)<70);
  let rec;
  if(!mal.length)rec="Puede subir la dificultad o la cantidad de preguntas para seguir retándose.";
  else if(debiles.length)rec="Conviene repasar la guía de estudio de la "+debiles.map(k=>"Práctica "+k).join(" y de la ")+", y volver a intentar con el botón \"Repasar solo las falladas\".";
  else rec="Su base es buena. Revise las preguntas falladas y repítalas con el botón \"Repasar solo las falladas\".";
  h+="<div class='card'><h2 style='margin-top:0'>Recomendación</h2><p style='margin:0'>"+esc(rec)+"</p></div>";
  return {html:h,ok:ok,n:n,p:p,fecha:fecha,mal:mal,min:mm,seg:ss,rec:rec};
}
function terminar(){
  const r=construirReporte();
  sesion.rep=r;
  $("#repContenido").innerHTML=r.html;
  $("#quiz").classList.add("hidden");$("#reporte").classList.remove("hidden");
  $("#btnFalladas").classList.toggle("hidden",r.mal.length===0);
  $("#msgCopia").textContent="";
  const h=leerHistorial();
  h.unshift({fecha:new Date().toLocaleDateString("es-DO"),sel:sesion.etiqueta,ok:r.ok,n:r.n,pct:r.p});
  guardarHistorial(h);
  window.scrollTo(0,0);
}
function volverInicio(){
  $("#quiz").classList.add("hidden");$("#reporte").classList.add("hidden");$("#setup").classList.remove("hidden");
  pintarHistorial();render();window.scrollTo(0,0);
}
$("#btnNueva").onclick=volverInicio;
$("#btnFalladas").onclick=()=>{
  const lista=sesion.rep.mal.map(i=>i.q);
  iniciar(shuffle(lista),"Repaso de preguntas falladas");
};
$("#btnImprimir").onclick=()=>window.print();
$("#btnDescargar").onclick=()=>{
  const r=sesion.rep;
  const css=document.querySelector("style").textContent;
  const doc="<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><title>Reporte de práctica</title><style>"+css+"</style></head><body><main>"+r.html+"</main></body></html>";
  const blob=new Blob([doc],{type:"text/html;charset=utf-8"});
  const a=mk("a",{href:URL.createObjectURL(blob),download:"reporte-matematica-discreta.html"});
  document.body.append(a);a.click();a.remove();
};
$("#btnCopiar").onclick=()=>{
  const r=sesion.rep,s=sesion;
  let t="Reporte de práctica · Matemática Discreta\n"+s.nombre+" · "+r.fecha+" · "+s.etiqueta+"\nResultado: "+r.ok+" de "+r.n+" ("+r.p+"%) · "+veredicto(r.p)+"\nTiempo: "+r.min+" min "+r.seg+" s\n";
  if(r.mal.length){t+="\nPreguntas falladas:\n";r.mal.forEach((it,k)=>{t+=(k+1)+". "+it.q.q+"\n   Su respuesta: "+textoResp(it)+"\n   Correcta: "+textoCorrecto(it)+"\n";});}
  t+="\nRecomendación: "+r.rec+"\n";
  const ok=()=>{$("#msgCopia").textContent="Resumen copiado.";};
  const fallo=()=>{$("#msgCopia").textContent="No se pudo copiar automáticamente. Use el botón de imprimir o descargar.";};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fallo);}else{fallo();}
};

render();pintarHistorial();
})();
</script>
